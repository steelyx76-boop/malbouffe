name: Vinted & Leboncoin NumWorks Monitor

on:
  schedule:
    # Relance automatique toutes les 5 heures pour assurer une veille 24/7
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permet de lancer manuellement en 1 clic

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # ~5h50 max par exécution (limite GitHub Actions: 6h)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen items cache
        uses: actions/cache@v4
        with:
          path: |
            seen_ids.json
            seen_lbc_ids.json
          key: seen-ids-${{ github.run_id }}
          restore-keys: |
            seen-ids-

      - name: Run Dual Sniper (Vinted + Leboncoin)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEARCH_TEXT: "numworks"
          MIN_PRICE: "20"
          MAX_PRICE: "35"
          POLL_INTERVAL: "3"
          POLL_INTERVAL_LBC: "8"
          MAX_AGE_MINUTES: "10"
          DISCORD_MENTION: "@everyone"
          SEEN_FILE: "seen_ids.json"
          SEEN_FILE_LBC: "seen_lbc_ids.json"
        run: |
          python3 sniper_all.py
