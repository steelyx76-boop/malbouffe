name: Vinted NumWorks Monitor

on:
  schedule:
    # Relance automatique toutes les 5 heures pour assurer une veille continue
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permet de lancer / relancer manuellement en 1 clic

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # ~5h50 max par exécution (limite GitHub Actions: 6h)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen items cache
        uses: actions/cache@v4
        with:
          path: seen_ids.json
          key: seen-ids-${{ github.run_id }}
          restore-keys: |
            seen-ids-

      - name: Run Vinted Real-Time Sniper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEARCH_TEXT: "numworks"
          MIN_PRICE: "20"
          MAX_PRICE: "40"
          POLL_INTERVAL: "3"
          MAX_AGE_MINUTES: "10"
          DISCORD_MENTION: "@everyone"
          SEEN_FILE: "seen_ids.json"
        run: |
          python3 vinted_numworks_discord.py
